<header>Custom filter filename</header>
<p>Enter the filter name followed by <tt>.toml</tt>, such as <tt>myapp.toml</tt>. It is saved directly under <tt>/etc/minsec/filters</tt>.</p>
<p>The filename selects the filter. A custom file with the same name as a built-in filter replaces that built-in definition.</p>
