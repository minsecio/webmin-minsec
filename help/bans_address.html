<header>Address or network</header>
<p>IPv4 or IPv6 address, or a CIDR network, to ban manually. Host addresses are normalized to <tt>/32</tt> or <tt>/128</tt>; CIDRs are normalized to their network address.</p>
<p>Minsec refuses networks that overlap its effective allowlist.</p>
