<header>Firewall backend</header>
<p><tt>nft</tt> maintains Minsec's nftables table, <tt>null</tt> logs decisions without changing the firewall, and <tt>exec</tt> invokes a trusted operator-provided command.</p>
<p>The <tt>exec</tt> backend also requires <tt>defaults.exec_command</tt>, which can be configured on the Raw TOML page.</p>
