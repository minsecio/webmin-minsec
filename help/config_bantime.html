<header>Default ban duration</header>
<p>The initial lifetime for automatic bans and for manual bans that do not specify a duration.</p>
<p>Enter seconds or a duration using <tt>s</tt>, <tt>m</tt>, <tt>h</tt>, <tt>d</tt>, or <tt>w</tt>, such as <tt>3600</tt>, <tt>1h</tt>, or <tt>1h30m</tt>.</p>
